name: Build Release APK

on:
  # Pushing a version tag publishes a GitHub Release, which is what the in-app
  # updater polls. Tag names are parsed as versions, so they must look like v1.14.0.
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - uses: gradle/actions/setup-gradle@v3

    - run: ./gradlew assembleRelease

    - name: Sign app APK
      id: sign_app
      uses: ilharp/sign-android-release@nightly
      with:
        releaseDir: app/build/outputs/apk/release
        signingKey: ${{ secrets.SIGNING_KEY }}
        keyAlias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: signed-apks
        path: app/build/outputs/apk/release/*-arm64-v8a-release-signed.apk
        if-no-files-found: error
        retention-days: 20

    # UpdateUtil picks the release asset whose filename contains the device ABI, so the
    # ABI has to survive into the published name. The signing action appends
    # "-signed" to each APK; strip it so the names stay the ones the app expects.
    - name: Prepare release assets
      id: assets
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        mkdir -p release-assets
        for f in app/build/outputs/apk/release/*-release-signed.apk; do
          cp "$f" "release-assets/$(basename "${f%-signed.apk}.apk")"
        done
        ls -la release-assets
        # The updater compares the release *name* against the installed versionName,
        # so publish it as the bare version: the tag without its leading "v".
        echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        name: ${{ steps.assets.outputs.version }}
        files: release-assets/*.apk
        generate_release_notes: true
